name: Deploy to Production (Hostinger)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, ctype, json, tokenizer
        
    - name: Install Node dependencies
      run: npm ci
      
    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction
      
    - name: Build CSS using Tailwind (skip Sass)
      run: |
        # Build Tailwind CSS directly
        npx tailwindcss -i ./assets/scss/tailwind.scss -o ./assets/css/site-styles.css --minify
        
    - name: Minify CSS files
      run: npx grunt cssmin
      
    - name: Minify JavaScript files  
      run: npx grunt uglify
      
    - name: Create theme package
      run: |
        mkdir -p build/engispace-theme
        
        # Copy all theme files except development files
        rsync -av --exclude='node_modules' \
                  --exclude='build' \
                  --exclude='gruntfile.js' \
                  --exclude='package.json' \
                  --exclude='package-lock.json' \
                  --exclude='composer.json' \
                  --exclude='composer.lock' \
                  --exclude='assets/scss' \
                  --exclude='.git' \
                  --exclude='.gitignore' \
                  --exclude='.DS_Store' \
                  --exclude='tailwind.config.js' \
                  --exclude='.github' \
                  ./ build/engispace-theme/
                  
        # Create zip file
        cd build
        zip -r engispace-theme.zip engispace-theme/
        cd ..
        
        echo "✅ Theme package created: $(ls -lah build/engispace-theme.zip)"
        
    - name: Create backup script
      run: |
        cat > backup.sh << 'EOF'
        #!/bin/bash
        echo "Creating backup of current theme..."
        mkdir -p backups/$(date +%Y%m%d_%H%M%S)
        cp -r engispace-theme/* backups/$(date +%Y%m%d_%H%M%S)/ 2>/dev/null || true
        echo "Backup created successfully"
        EOF
        chmod +x backup.sh
        
    - name: Upload theme zip to server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        local-dir: ./build/
        server-dir: /public_html/wp-content/themes/
        clean: false
        dangerous-clean-slate: false
          
    - name: Extract theme on server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /public_html/wp-content/themes
          
          # Create backup of current theme
          if [ -d "engispace-theme" ]; then
            echo "📦 Creating backup..."
            mv engispace-theme engispace-theme-backup-$(date +%Y%m%d_%H%M%S)
          fi
          
          # Extract new theme
          echo "📂 Extracting new theme..."
          unzip -q engispace-theme.zip
          
          # Verify extraction
          if [ -f "engispace-theme/style.css" ] && [ -f "engispace-theme/functions.php" ]; then
            echo "✅ Theme extracted successfully"
            echo "📁 Theme directory contents:"
            ls -la engispace-theme/
            
            # Clean up zip file
            rm engispace-theme.zip
            echo "🧹 Cleaned up zip file"
          else
            echo "❌ Theme extraction failed"
            exit 1
          fi
          
    - name: Clear WordPress cache (if applicable)
      uses: appleboy/ssh-action@v1.0.0
      continue-on-error: true
      with:
        host: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /public_html
          # Clear common WordPress cache
          find wp-content/cache -type f -name "*.cache" -delete 2>/dev/null || true
          find wp-content/uploads/cache -type f -delete 2>/dev/null || true
          echo "Cache cleared (if any existed)"
          
    - name: Send deployment notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          🚀 *Production Deployment*
          
          *Status:* ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
          *Branch:* ${{ github.ref_name }}
          *Commit:* ${{ github.sha }}
          *Author:* ${{ github.actor }}
          
          ${{ job.status == 'success' && '🎉 Theme successfully deployed to production!' || '⚠️ Deployment failed. Please check the logs.' }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true
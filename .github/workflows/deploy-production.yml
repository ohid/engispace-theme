name: Deploy to Production (Hostinger)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction
      
    - name: Create theme package
      run: |
        mkdir -p build/engispace-theme
        
        # Copy all theme files except development files
        rsync -av --exclude='node_modules' \
                  --exclude='build' \
                  --exclude='gruntfile.js' \
                  --exclude='package.json' \
                  --exclude='package-lock.json' \
                  --exclude='composer.json' \
                  --exclude='composer.lock' \
                  --exclude='assets/scss' \
                  --exclude='.git' \
                  --exclude='.gitignore' \
                  --exclude='.DS_Store' \
                  --exclude='tailwind.config.js' \
                  --exclude='.github' \
                  ./ build/engispace-theme/
                  
        echo "✅ Theme package created: $(ls -lah build/engispace-theme/)"
        
    - name: Upload theme files directly to server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        local-dir: ./build/engispace-theme/
        server-dir: wp-content/themes/engispace-theme/
        dangerous-clean-slate: false
          
    - name: Clear WordPress cache (if applicable)
      uses: appleboy/ssh-action@v1.2.2
      continue-on-error: true
      with:
        host: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Clear common WordPress cache (from public_html root)
          cd /
          find wp-content/cache -type f -name "*.cache" -delete 2>/dev/null || true
          find wp-content/uploads/cache -type f -delete 2>/dev/null || true
          echo "Cache cleared (if any existed)"
